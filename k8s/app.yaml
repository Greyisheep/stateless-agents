# Everything the demo runs: the stores, the fake model and the agent.
apiVersion: apps/v1
kind: Deployment
metadata: {name: postgres}
spec:
  selector: {matchLabels: {app: postgres}}
  template:
    metadata: {labels: {app: postgres}}
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          env:
            - {name: POSTGRES_USER, value: demo}
            - {name: POSTGRES_PASSWORD, value: demo}
            - {name: POSTGRES_DB, value: demo}
          ports: [{containerPort: 5432}]
          readinessProbe: {exec: {command: [pg_isready, -U, demo]}, periodSeconds: 2}
---
apiVersion: v1
kind: Service
metadata: {name: postgres}
spec: {selector: {app: postgres}, ports: [{port: 5432}]}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: redis}
spec:
  selector: {matchLabels: {app: redis}}
  template:
    metadata: {labels: {app: redis}}
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports: [{containerPort: 6379}]
---
apiVersion: v1
kind: Service
metadata: {name: redis}
spec: {selector: {app: redis}, ports: [{port: 6379}]}
---
# The model. Fake by default: Gemini's API, no key, a quota knob.
apiVersion: apps/v1
kind: Deployment
metadata: {name: fakemodel}
spec:
  selector: {matchLabels: {app: fakemodel}}
  template:
    metadata: {labels: {app: fakemodel}}
    spec:
      containers:
        - name: fakemodel
          image: stateless-agents/fakemodel:dev
          imagePullPolicy: Never
          ports: [{containerPort: 8080}]
---
apiVersion: v1
kind: Service
metadata: {name: fakemodel}
spec:
  type: NodePort
  selector: {app: fakemodel}
  ports: [{port: 8080, nodePort: 30081}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: agent}
spec:
  replicas: 1
  selector: {matchLabels: {app: agent}}
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 100%, maxUnavailable: 0}
  template:
    metadata: {labels: {app: agent}}
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: agent
          image: stateless-agents/agent:dev
          imagePullPolicy: Never
          command: ["/app/start.sh"]
          env:
            - name: POD_NAME
              valueFrom: {fieldRef: {fieldPath: metadata.name}}
            - {name: GOOGLE_GEMINI_BASE_URL, value: "http://fakemodel:8080"}
            - {name: GOOGLE_API_KEY, value: "not-needed-for-the-fake-model"}
            - {name: GOOGLE_GENAI_USE_VERTEXAI, value: "false"}
          ports: [{containerPort: 8080}]
          readinessProbe: {httpGet: {path: /healthz, port: 8080}, periodSeconds: 2}
          lifecycle:
            # Give the Service a moment to stop sending new turns before SIGTERM.
            preStop: {exec: {command: ["sleep", "3"]}}
          resources:
            requests: {cpu: 100m, memory: 200Mi}
---
apiVersion: v1
kind: Service
metadata: {name: agent}
spec:
  type: NodePort
  selector: {app: agent}
  ports: [{port: 8080, nodePort: 30080}]
