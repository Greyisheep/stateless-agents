# One node is enough for the demo. The agent and the fake model's controls are
# reachable from the laptop on 18080 and 18081.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: stateless-agents
nodes:
  - role: control-plane
    extraPortMappings:
      - {containerPort: 30080, hostPort: 18080}
      - {containerPort: 30081, hostPort: 18081}
